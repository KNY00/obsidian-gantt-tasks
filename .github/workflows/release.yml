name: Build and Release Vite App

on:
  push:
    tags:
      - 'v*' # Trigger workflow on tags matching v1.0.0, v2.1.0, etc.

permissions:
  contents: write # Grants permission to create releases and upload assets

jobs:  
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Zip dist folder
        run: zip -r dist-${{ github.ref_name }}.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-${{ github.ref_name }}.zip
          generate_release_notes: true